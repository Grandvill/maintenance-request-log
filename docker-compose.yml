services:
  # ============================================================
  # DATABASE SERVICE (PostgreSQL)
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: maintenance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - maintenance_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # BACKEND SERVICE (Go)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maintenance_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # Wait until Postgres is truly ready
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKEND_PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_HOURS: ${JWT_EXPIRES_IN_HOURS}
      APP_ENV: ${APP_ENV}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    networks:
      - maintenance_network

  # ============================================================
  # FRONTEND SERVICE (Nuxt 3)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # This build-arg is injected at build time for SSR/SSG
        NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL}
    container_name: maintenance_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:3000"
    networks:
      - maintenance_network

# ============================================================
# NAMED VOLUMES
# ============================================================
volumes:
  postgres_data:
    driver: local

# ============================================================
# NETWORKS
# ============================================================
networks:
  maintenance_network:
    driver: bridge

